<h2>你喜欢哪种视觉风格？</h2>
<p class="subtitle">这决定了整体优化的方向</p>

<div class="options">
  <div class="option" data-choice="glassmorphism" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>精致毛玻璃</h3>
      <p>在当前风格上深化 — 更强的高斯模糊、半透明层叠、微妙的边框光晕，现代 macOS/iOS 风格</p>
    </div>
  </div>
  <div class="option" data-choice="minimal-dark" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>极简暗黑</h3>
      <p>大面积深色背景，减少卡片数量，突出核心内容，字体排印驱动，留白更多</p>
    </div>
  </div>
  <div class="option" data-choice="cyber-neon" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>赛博霓虹</h3>
      <p>渐变边框、霓虹发光、深色+高饱和点缀色，科技感更强</p>
    </div>
  </div>
</div>
