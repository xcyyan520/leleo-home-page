<h2>暗色二次元 - 哪种感觉更接近？</h2>
<p class="subtitle">都偏暗调，但氛围不同</p>

<div class="options">
  <div class="option" data-choice="starry-sakura" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>夜空樱花</h3>
      <p>深蓝紫色夜空基调，柔和的粉色/淡紫点缀，飘落花瓣粒子，静谧梦幻感。参考：夜晚樱花树下的氛围</p>
    </div>
  </div>
  <div class="option" data-choice="moonlit-washitsu" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>月下和室</h3>
      <p>深棕/暗灰基调，暖黄纸灯笼光晕，木纹质感，障子纸纹理。参考：月光照进和室的和风侘寂</p>
    </div>
  </div>
  <div class="option" data-choice="starry-studio" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>星空之夜</h3>
      <p>类似你思绪页面的风格延续 — 深邃星空背景，柔和星点，半透明卡片，视觉轻盈但色调暗沉</p>
    </div>
  </div>
  <div class="option" data-choice="vapor-dark" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>暗调蒸汽波</h3>
      <p>暗紫/暗蓝渐变，低饱和度的霓虹感，轻微扫描线/颗粒质感，复古未来主义但克制的亮度</p>
    </div>
  </div>
</div>
