<h2>你希望主页面做哪方面的优化？</h2>
<p class="subtitle">可以多选，我会根据你的选择来设计方案</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="visual" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>视觉美化</h3>
      <p>颜色、字体、间距、动画效果、毛玻璃质感等视觉层面的打磨</p>
    </div>
  </div>
  <div class="option" data-choice="layout" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>布局优化</h3>
      <p>左右分栏比例、卡片排列、响应式适配、信息架构重组</p>
    </div>
  </div>
  <div class="option" data-choice="ux" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>交互体验</h3>
      <p>操作流畅度、过渡动画、按钮反馈、移动端手势等用户体验</p>
    </div>
  </div>
  <div class="option" data-choice="all" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>全面优化</h3>
      <p>以上全部，整体提升主页品质</p>
    </div>
  </div>
</div>
