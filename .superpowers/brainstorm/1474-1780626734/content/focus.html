<h2>你想优化哪些页面？</h2>
<p class="subtitle">了解焦点有助于我给出针对性的优化方案</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="main-page" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>主页面 (index.html)</h3>
      <p>个人主页 — 包含头像、标签、项目卡片、极坐标图、壁纸切换、音乐播放器</p>
    </div>
  </div>
  <div class="option" data-choice="thoughts-page" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>思绪/星云页面 (thoughts.html)</h3>
      <p>Memory Nebula — 星空动画、浮动思绪气泡、Canvas粒子、捕获凝视效果</p>
    </div>
  </div>
  <div class="option" data-choice="both" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>两个页面都优化</h3>
      <p>整体提升，保持风格统一</p>
    </div>
  </div>
</div>
