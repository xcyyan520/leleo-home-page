<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;max-width:100%;overflow:hidden;overflow-x:hidden;background:#0a0a1a;color:#d8d2c8;
    overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
  body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);}
  #stageWrap{position:relative;flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;display:flex;}
  #stage{position:relative;flex:1 1 auto;min-height:0;min-width:0;overflow:auto;box-sizing:border-box;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;}
  canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;}
  #panHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;max-width:94%;
    padding:6px 12px;border-radius:999px;background:rgba(13,13,36,0.9);border:1px solid #2a2740;color:#aaa49a;
    font:13px/1.2 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;white-space:nowrap;text-align:center;
    pointer-events:none;opacity:0;transition:opacity .6s ease;}
  #panHint.on{opacity:1;}
  #rotHint{position:absolute;left:0;right:0;top:0;z-index:6;display:none;align-items:center;gap:10px;
    padding:6px 10px;background:rgba(13,13,36,0.94);border-bottom:1px solid #2a2740;color:#d8d2c8;
    font:13px/1.3 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;}
  #rotHint.on{display:flex;}
  #rotHint span{flex:1 1 auto;}
  #bar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#0d0d24;border-top:1px solid #2a2740;
    font:13px/1.35 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;}
  button{background:#141230;color:#d8d2c8;border:1px solid #2a2740;border-radius:6px;padding:8px 12px;min-height:40px;
    cursor:pointer;font:13px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;}
  button:hover{border-color:#8b7aaa;color:#8b7aaa;}
  button:active{border-color:#8b7aaa;color:#8b7aaa;}
  .mut{color:#8d8779;}
  #probeOut{font:12px Consolas,monospace;color:#7fa07a;white-space:pre;}
  a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid #2a2740;border-radius:6px;
    background:#141230;color:#7f8fb5;text-decoration:none;font-size:13px;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;}
  a:active{border-color:#8b7aaa;color:#8b7aaa;}
  @media (max-width:600px){
    #btnProbe{display:none;}
    #probeOut{display:none;}
    #bar{padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:8px;}
    #bar button{padding:8px 10px;}
    .hint{display:none;}
  }
  @media (max-height:480px){
    #bar{padding:4px 8px calc(4px + env(safe-area-inset-bottom));}
  }
</style>

.tblwrap,.tbl-wrap,table{ font-size:13.5px !important; }

<script>/*__perfLayer__*/
/* ============================================================
   帧率自适应 + 后台暂停（性能层）
   ------------------------------------------------------------
   为什么需要：这些页面每帧都重绘整张 1440x900 设计稿（底色 + 滚动网格 +
   径向光晕 + 每个面板的全部文字和图形）。实测在降速 4 倍的手机上，单帧脚本
   就要 570~740 ms/s，主线程几乎 100% 占满 —— 表现就是整页发卡、滚动和点击
   都不跟手。降到 30 FPS 后主线程占用直接减半；画面本来就是缓慢的数据流动
   画和数字滚动，30 帧和 60 帧看不出差别，但手感完全不同。

   怎么判断该不该降：
     不靠“首屏跑多少帧”这种一次性测量 —— 那会把页面加载期的卡顿误判成设备
     性能差，把明明很快的电脑也锁到 30 帧。做法是：
        · 先跑满 2.5 秒不干预（加载期的布局、字体、图片解码都在这段时间）；
        · 之后始终记录原生帧间隔，取最近 120 帧（约 2 秒）；
        · 中位数 或 平均值 任一超过 20ms（跑不到 50 FPS）才降帧。
     用平均值是因为有些页面大部分帧都「刚好卡在一个 vsync 上」，中位数看着像
     满帧，实际长尾很长、主线程已经画满，只看中位数会漏掉它。窗口只有 2 秒且
     一直在滚动，所以偶发卡顿会很快被冲掉，快的机器完全不受影响。

   怎么恢复：
     降帧后每 20 秒放回原生帧率跑 0.8 秒实测一次，跑得动就恢复。
     注意复检必须真的回到原生帧率才有意义 —— 在限帧状态下量到的帧间隔永远
     是 33ms，量不出设备到底跑不跑得动。

   另外：切到后台就停止绘制（原来后台也在满速空转，白耗电），并且系统开了
   「减少动态效果」时直接按低帧率跑。
   ============================================================ */
(function () {
  var realRaf = window.requestAnimationFrame.bind(window);
  var realCaf = window.cancelAnimationFrame.bind(window);

  var SLOW_MS = 1000 / 30;          /* 限帧后的目标帧间隔 */
  var BAD_MS = 20;                  /* 平均/中位帧间隔超过它 = 跑不到 50 FPS */
  var GOOD_MS = 17;                 /* 恢复阈值：实测低于它才算跑得动 */
  var WIN = 120;                    /* 统计窗口（帧） */
  var MIN_SAMPLES = 60;             /* 至少这么多帧才做判断 */
  var GRACE_MS = 2500;              /* 启动后先不干预的时长 */
  var RECHECK_EVERY = 20000;        /* 限帧状态下每隔多久复检 */
  var RECHECK_FOR = 800;            /* 复检时以原生帧率跑多久 */

  var hist = new Float64Array(WIN);
  var histN = 0, histI = 0, lastNative = 0;

  var capped = false;               /* 是否正在限帧 */
  var probing = false;              /* 是否处于「回原生帧率实测」窗口 */
  var queue = new Map();
  var nextId = 1;
  var timer = null, lastDraw = 0;
  var probeTimer = null;
  var startAt = performance.now();
  var reducedMotion = false;
  var probeEnd = 0;

  function push(dt) {
    hist[histI] = dt; histI = (histI + 1) % WIN;
    if (histN < WIN) histN++;
  }
  function resetHist() { histN = 0; histI = 0; lastNative = 0; }
  function median() {
    if (!histN) return 0;
    var a = Array.prototype.slice.call(hist, 0, histN).sort(function (x, y) { return x - y; });
    return a[a.length >> 1];
  }
  function mean() {
    if (!histN) return 0;
    var s = 0;
    for (var i = 0; i < histN; i++) s += hist[i];
    return s / histN;
  }
  function isSlow() {
    if (histN < MIN_SAMPLES) return false;
    return median() > BAD_MS || mean() > BAD_MS;
  }

  /* ---------- 限帧状态的进入/退出 ---------- */
  function flush() {
    timer = null;
    lastDraw = performance.now();
    var batch = [];
    queue.forEach(function (cb) { batch.push(cb); });
    queue.clear();
    for (var i = 0; i < batch.length; i++) {
      try { batch[i](lastDraw); } catch (e) { if (window.console) console.error(e); }
    }
  }
  function schedule() {
    if (timer !== null || !queue.size) return;
    var w = SLOW_MS - (performance.now() - lastDraw);
    timer = setTimeout(flush, w < 0 ? 0 : w);
  }
  /* 从限帧状态回到原生帧率：把队列里等待的回调交还给原生 rAF，
     否则它们会被永远晾在队列里（页面就停在最后一帧了）。 */
  function drainToNative() {
    if (timer !== null) { clearTimeout(timer); timer = null; }
    if (!queue.size) return;
    var batch = [];
    queue.forEach(function (cb) { batch.push(cb); });
    queue.clear();
    for (var i = 0; i < batch.length; i++) {
      (function (cb) {
        realRaf(function (now) { sample(now); try { cb(now); } catch (e) { if (window.console) console.error(e); } });
      })(batch[i]);
    }
  }
  function stopProbeTimer() {
    if (probeTimer !== null) { clearTimeout(probeTimer); probeTimer = null; }
  }
  function startProbe() {
    stopProbeTimer();
    probeEnd = performance.now() + RECHECK_FOR;
    probing = true;
    resetHist();
    drainToNative();
    probeTimer = setTimeout(endProbe, RECHECK_FOR);
  }
  function endProbe() {
    probeTimer = null;
    probing = false;
    var fast = histN >= MIN_SAMPLES / 2
      && median() < GOOD_MS && mean() < GOOD_MS;
    /* 「减少动态效果」是用户的明确意愿，实测再快也保持低帧率 */
    capped = reducedMotion ? true : !fast;
    resetHist();
    if (capped) {
      probeTimer = setTimeout(startProbe, RECHECK_EVERY);
    }
    /* 恢复原生帧率后不排下一次复检：观察逻辑本身会在再次变慢时接管 */
  }

  /* ---------- 每帧采样与决策 ---------- */
  function sample(now) {
    if (lastNative) push(now - lastNative);
    lastNative = now;

    if (probing) {
      if (now >= probeEnd) endProbe();
      return;
    }
    if (capped) return;
    if (now - startAt < GRACE_MS) return;   /* 启动期不做判断 */

    if (isSlow()) {
      capped = true;
      resetHist();
      probeTimer = setTimeout(startProbe, RECHECK_EVERY);
      if (queue.size) schedule();
    }
  }

  window.requestAnimationFrame = function (cb) {
    if (typeof cb !== 'function') return realRaf(cb);
    if (!capped || probing) {
      return realRaf(function (now) { sample(now); return cb(now); });
    }
    var id = nextId++;
    queue.set(id, cb);
    schedule();
    return id;
  };
  window.cancelAnimationFrame = function (id) {
    if (!(queue.delete(id))) realCaf(id);
  };

  /* 切到后台就不再绘制 */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (timer !== null) { clearTimeout(timer); timer = null; }
      stopProbeTimer();
      resetHist();
    } else if (capped) {
      lastDraw = 0;
      if (probing) { probing = false; }
      startProbe();
    }
  });

  /* 系统开了「减少动态效果」：直接按低帧率跑，并且不再回原生帧率实测 */
  try {
    reducedMotion = !!(window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (e) {}
  if (reducedMotion) { capped = true; }

  window.__perfLayer = function () {
    return {
      mode: reducedMotion ? 'reduced-motion' : (probing ? 'probing' : (capped ? 'capped' : 'native')),
      capped: capped,
      medianMs: +median().toFixed(2),
      meanMs: +mean().toFixed(2),
      samples: histN
    };
  };
})();
</script>

function toDesign(e){
  var r = cv.getBoundingClientRect(), d = viewDpr || 1, s = viewScale || 1;
  return { x: (((e.clientX - r.left) * d) - viewOffX) / s, y: (((e.clientY - r.top) * d) - viewOffY) / s };
}

/* ---- 触屏等价交互：触屏没有 hover，点一下就把该点当作悬停位置（1.6s 后自动清除） ---- */
function tapHover(e){
  if (e.pointerType === 'mouse') return;
  var p = toDesign(e);
  mouse.x = p.x; mouse.y = p.y;
  clearTimeout(hoverClrT);
  hoverClrT = setTimeout(function(){ mouse.x = -999; mouse.y = -999; }, 1600);
}
if (window.PointerEvent){
  cv.addEventListener('pointerdown', function(e){ tapHover(e); }, { passive: true });
  cv.addEventListener('pointercancel', function(){ mouse.x = -999; mouse.y = -999; });
} else {
  cv.addEventListener('touchstart', function(e){ if (e.touches && e.touches[0]) tapHover(e.touches[0]); }, { passive: true });
  cv.addEventListener('touchend', function(){
    clearTimeout(hoverClrT);
    hoverClrT = setTimeout(function(){ mouse.x = -999; mouse.y = -999; }, 1600);
  }, { passive: true });
}

  ctx.fillStyle=color; ctx.textAlign=align||'left'; ctx.fillText(s,x,y); ctx.restore(); }
function ellipsis(s,max,size,weight,mono){ ctx.save(); ctx.font=F(size,weight,mono);
  if(ctx.measureText(s).width<=max){ ctx.restore(); return s; }
  var out=s; while(out.length>1 && ctx.measureText(out+'…').width>max){ out=out.slice(0,-1); } ctx.restore(); return out+'…'; }
function wrapText(s,max,size,weight){ ctx.save(); ctx.font=F(size,weight); var lines=[],cur='';
  for(var i=0;i<s.length;i++){ var ch=s[i];
    if(ch==='\n'){ lines.push(cur); cur=''; continue; }
    if(ctx.measureText(cur+ch).width>max && cur.length){ lines.push(cur); cur=ch; } else cur+=ch; }
  if(cur.length) lines.push(cur); ctx.restore(); return lines; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

    ctx.fillStyle=grad(0,sy-14,0,sy+14,[[0,hexA(k.c,0)],[0.5,hexA(k.c,0.07)],[1,hexA(k.c,0)]]);
    ctx.fillRect(x,sy-14,cw,28);

    var vs = (i===3) ? fmtNum(v,1) : fmtNum(v);
    glowText(vs,x+18,y+74,38,k.c,'left','700',14);

    text(k.d,x+20,y+96,10.5, k.up?'#7fa07a':'#7f8fb5','left','500');

    var sx = x+cw-118, sy2 = y+48, sw = 100, sh = 44;
    ctx.save(); ctx.beginPath(); ctx.rect(sx,sy2,sw,sh); ctx.clip();

    for (var j=0;j<k.spark.length;j++){
      var px = sx + sw*j/(k.spark.length-1);
      var py = sy2 + sh - sh*k.spark[j]*prog;
      if (j===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.strokeStyle=k.c; ctx.lineWidth=1.6; ctx.shadowColor=k.c; ctx.shadowBlur=6; ctx.stroke(); ctx.shadowBlur=0;
    ctx.lineTo(sx+sw,sy2+sh); ctx.lineTo(sx,sy2+sh); ctx.closePath();
    ctx.fillStyle=grad(0,sy2,0,sy2+sh,[[0,hexA(k.c,0.22)],[1,hexA(k.c,0)]]); ctx.fill();
    ctx.restore();
    /* 端点 */
    var lx = sx+sw, ly = sy2 + sh - sh*k.spark[k.spark.length-1]*prog;
    ctx.beginPath(); ctx.arc(lx,ly,3,0,6.2832); ctx.fillStyle=k.c; ctx.fill();

function frame(now){
  var ts = now/1000;
  if (!st.last) st.last = ts;
  var dt = Math.min(0.05, ts-st.last); st.last = ts; st.dt = dt;
  if (!paused){ st.t += dt; frames++;
    if (ts-fpsT >= 0.5){ fps = frames/(ts-fpsT); frames=0; fpsT=ts; } }
  try { draw(st.t); } catch(e){ errors++; if (errors<4) console.error(e); }
  rafId = requestAnimationFrame(frame);
}

<script>/*__themeWire__*/
(function(){
  var X = window.XTheme
  var b = document.getElementById('btnTheme')
  if (!X || !b) return
  var paint = function(m){
    b.textContent = m === 'light' ? '☾' : '☀'
    b.title = m === 'light' ? '切换到夜间' : '切换到白天'
    b.setAttribute('aria-label', b.title)
    b.classList.toggle('on', m === 'light')
  }
  paint(X.mode)
  X.subscribe(paint)
  b.addEventListener('click', function(){ X.toggle() })
})()
</script>
