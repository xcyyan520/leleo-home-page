<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;max-width:100%;overflow:hidden;overflow-x:hidden;background:#0a0a1a;color:#d8d2c8;
    overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
  body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);}
  #stageWrap{position:relative;flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;display:flex;}
  #stage{position:relative;flex:1 1 auto;min-height:0;min-width:0;overflow:auto;box-sizing:border-box;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;}
  canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;}
  #panHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;max-width:94%;
    padding:6px 12px;border-radius:999px;background:rgba(13,13,36,0.9);border:1px solid #2a2740;color:#aaa49a;
    font:13px/1.2 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;white-space:nowrap;text-align:center;
    pointer-events:none;opacity:0;transition:opacity .6s ease;}
  #panHint.on{opacity:1;}
  #rotHint{position:absolute;left:0;right:0;top:0;z-index:6;display:none;align-items:center;gap:10px;
    padding:6px 10px;background:rgba(13,13,36,0.94);border-bottom:1px solid #2a2740;color:#d8d2c8;
    font:13px/1.3 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;}
  #rotHint.on{display:flex;}
  #rotHint span{flex:1 1 auto;}
  #bar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#0d0d24;border-top:1px solid #2a2740;
    font:13px/1.35 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;}
  button{background:#141230;color:#d8d2c8;border:1px solid #2a2740;border-radius:6px;padding:8px 12px;min-height:40px;
    cursor:pointer;font:13px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;}
  button:hover{border-color:#8b7aaa;color:#8b7aaa;}
  button:active{border-color:#8b7aaa;color:#8b7aaa;}
  .mut{color:#8d8779;}
  #probeOut{font:12px Consolas,monospace;color:#7fa07a;white-space:pre;}
  a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid #2a2740;border-radius:6px;
    background:#141230;color:#7f8fb5;text-decoration:none;font-size:13px;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;}
  a:active{border-color:#8b7aaa;color:#8b7aaa;}
  @media (max-width:600px){
    #btnProbe{display:none;}
    #probeOut{display:none;}
    #bar{padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:8px;}
    #bar button{padding:8px 10px;}
    .hint{display:none;}
  }
  @media (max-height:480px){
    #bar{padding:4px 8px calc(4px + env(safe-area-inset-bottom));}
  }
</style>

/* ---- tier 1: raised surfaces (the real "cards") ---- */
.card,.kpi,.hero,.chain-box,.tl-item > .card{
  background-color:rgba(24,21,48,.72) !important;
  background-image:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 140px) !important;
  border:1px solid rgba(255,255,255,.075) !important;
  border-radius:14px !important;
  box-shadow:0 10px 30px -22px rgba(0,0,0,.95);
  transition:border-color .25s ease,transform .25s ease;
}
.card:hover,.kpi:hover,.hero:hover,.chain-box:hover,.tl-item > .card:hover{
  border-color:rgba(255,255,255,.14) !important;
}

/* ---- tier 2: recessed wells (structure, not chrome) ---- */
.group,.fig,.tblwrap,.tbl-wrap,.check,.term,.svc{
  background-color:rgba(255,255,255,.02) !important;
  background-image:none !important;
  border:1px solid rgba(255,255,255,.055) !important;
  border-radius:12px !important;
}

/* ---- tier 3: small repeated bits ---- */
.box,.node,.chip{
  background-color:rgba(255,255,255,.025) !important;
  background-image:none !important;
  border:1px solid rgba(255,255,255,.06) !important;
  border-radius:10px !important;
  transition:border-color .2s ease,background-color .2s ease;
}
.box:hover,.node:hover,.chip:hover{
  border-color:rgba(255,255,255,.14) !important;
  background-color:rgba(255,255,255,.045) !important;
}
.badge{border-radius:999px !important;}

<body>
<div id="stageWrap">
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="rotHint"><span>📱 建议横屏查看完整界面</span><button id="btnStayPortrait" type="button">仍然竖屏查看</button></div>

</div>

  <button id="btnToggle">⏸ 暂停</button>
  <button id="btnReset">⟲ 重来</button>
  <button id="btnView" type="button">⤢ 自动</button>
  <button id="btnProbe" type="button">__probe()</button>
  <span class="mut hint">顶部标签「工单列表 / 工单详情」可点击切换 · 表格行可点开详情</span>
  <a class="nav" href="0-原型总入口.html">← 返回原型入口</a>
  <a class="nav" href="../路线.html">← 回学习路线</a>
  <span id="probeOut"></span>

<script>
(function(){
'use strict';
/* ============================================================
   工单中心：列表视图 + 详情视图（标签切换），全部 Canvas 绘制
   ============================================================ */
var Q = new URLSearchParams(location.search);
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var DW = 1440, DH = 900;
function designH(){ var e=document.getElementById('stage'); var hh=e?e.clientHeight:0; return Math.max(700, Math.min(DH, Math.round(hh||DH))); }
var paused = Q.get('paused') === '1';
/* ---- 自检用 URL 参数：?probe=1 显示探针 · ?clock=0 冻结时钟 · ?t=秒 快进到指定动画时间 ---- */
var QPROBE = Q.get('probe') === '1';
var QCLOCK = Q.get('clock') !== '0';
var QT = parseFloat(Q.get('t') || '0') || 0;
var CD = Date;
function clockDate(){ return QCLOCK ? new CD() : new Date(2026, 8, 28, 10, 24, 7); }
function drawProbe(){
  if (!QPROBE) return;
  var p = window.__probe();
  var lines = [
    'PAGE ' + p.page,
    'playing ' + p.playing,
    'canvas ' + p.canvas.w + ' x ' + p.canvas.h,
    't ' + p.t + ' s',
    'errors ' + p.errors,
    'fps ' + p.fps
  ];
  var w = 196, h = 22 + lines.length*15;
  ctx.save();
