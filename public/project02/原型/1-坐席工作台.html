<title>坐席工作台 · Canvas 2D 全手绘</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;max-width:100%;overflow:hidden;overflow-x:hidden;background:#0a0a1a;color:#d8d2c8;
    overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
  body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);}
  #stageWrap{position:relative;flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;display:flex;}
  #stage{position:relative;flex:1 1 auto;min-height:0;min-width:0;overflow:auto;box-sizing:border-box;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;}
  canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;}
  #panHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;max-width:94%;
    padding:6px 12px;border-radius:999px;background:rgba(13,13,36,0.9);border:1px solid #2a2740;color:#aaa49a;
    font:13px/1.2 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;white-space:nowrap;text-align:center;
    pointer-events:none;opacity:0;transition:opacity .6s ease;}
  #panHint.on{opacity:1;}
  #rotHint{position:absolute;left:0;right:0;top:0;z-index:6;display:none;align-items:center;gap:10px;
    padding:6px 10px;background:rgba(13,13,36,0.94);border-bottom:1px solid #2a2740;color:#d8d2c8;
    font:13px/1.3 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;}
  #rotHint.on{display:flex;}
  #rotHint span{flex:1 1 auto;}
  #bar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#0d0d24;border-top:1px solid #2a2740;
    font:13px/1.35 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;}
  button{background:#141230;color:#d8d2c8;border:1px solid #2a2740;border-radius:6px;padding:8px 12px;min-height:40px;
    cursor:pointer;font:13px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;}
  button:hover{border-color:#8b7aaa;color:#8b7aaa;}
  button:active{border-color:#8b7aaa;color:#8b7aaa;}
  .mut{color:#8d8779;}
  #probeOut{font:12px Consolas,monospace;color:#7fa07a;white-space:pre;}
  a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid #2a2740;border-radius:6px;
    background:#141230;color:#7f8fb5;text-decoration:none;font-size:13px;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;}
  a:active{border-color:#8b7aaa;color:#8b7aaa;}
  @media (max-width:600px){
    #btnProbe{display:none;}
    #probeOut{display:none;}
    #bar{padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:8px;}
    #bar button{padding:8px 10px;}
    .hint{display:none;}
  }
  @media (max-height:480px){
    #bar{padding:4px 8px calc(4px + env(safe-area-inset-bottom));}
  }
</style>

<script>/*__perfLayer__*/
/* ============================================================
   帧率自适应 + 后台暂停（性能层）
   ------------------------------------------------------------
   为什么需要：这些页面每帧都重绘整张 1440x900 设计稿（底色 + 滚动网格 +
   径向光晕 + 每个面板的全部文字和图形）。实测在降速 4 倍的手机上，单帧脚本
   就要 570~740 ms/s，主线程几乎 100% 占满 —— 表现就是整页发卡、滚动和点击
   都不跟手。降到 30 FPS 后主线程占用直接减半；画面本来就是缓慢的数据流动
   画和数字滚动，30 帧和 60 帧看不出差别，但手感完全不同。

   怎么判断该不该降：
     不靠“首屏跑多少帧”这种一次性测量 —— 那会把页面加载期的卡顿误判成设备
     性能差，把明明很快的电脑也锁到 30 帧。做法是：
        · 先跑满 2.5 秒不干预（加载期的布局、字体、图片解码都在这段时间）；
        · 之后始终记录原生帧间隔，取最近 120 帧（约 2 秒）；
        · 中位数 或 平均值 任一超过 20ms（跑不到 50 FPS）才降帧。
     用平均值是因为有些页面大部分帧都「刚好卡在一个 vsync 上」，中位数看着像
     满帧，实际长尾很长、主线程已经画满，只看中位数会漏掉它。窗口只有 2 秒且
     一直在滚动，所以偶发卡顿会很快被冲掉，快的机器完全不受影响。

   怎么恢复：
     降帧后每 20 秒放回原生帧率跑 0.8 秒实测一次，跑得动就恢复。
     注意复检必须真的回到原生帧率才有意义 —— 在限帧状态下量到的帧间隔永远
     是 33ms，量不出设备到底跑不跑得动。

   另外：切到后台就停止绘制（原来后台也在满速空转，白耗电），并且系统开了
   「减少动态效果」时直接按低帧率跑。
   ============================================================ */
(function () {
  var realRaf = window.requestAnimationFrame.bind(window);
  var realCaf = window.cancelAnimationFrame.bind(window);

/* ================= 循环 ================= */
function frame(now){
  var ts = now/1000;
  if (!st.last) st.last = ts;
  var dt = Math.min(0.05, ts - st.last); st.last = ts; st.dt = dt;
  if (!paused){ st.t += dt; frames++;
    if (ts - fpsT >= 0.5){ fps = frames/(ts-fpsT); frames = 0; fpsT = ts; } }
  try { draw(st.t); } catch(e){ errors++; st.lastErr = (e && e.stack) ? String(e.stack).slice(0,300) : String(e); if (errors < 6) console.error(e); }
  rafId = requestAnimationFrame(frame);
}
