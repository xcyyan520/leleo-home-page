<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07060f">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Classic (non-module) so it runs before first paint. This page is ALWAYS
         night: 思绪 IS the starfield, so a paper mode would delete the whole
         point of it. Only the project02 deck offers a light mode. -->
    <script src="/js/theme.js"></script>
    <title>思绪</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #08080f;
        overflow: hidden;
        font-family: 'Georgia', 'Noto Serif SC', 'Source Han Serif SC', serif;
        height: 100vh;
        width: 100vw;
      }
      #thoughts-app {
        height: 100vh;
        width: 100vw;
        position: relative;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="pg-thoughts">
    <div id="thoughts-app"></div>
    <script type="module" src="/src/thoughts-main.js"></script>
  </body>
</html>
