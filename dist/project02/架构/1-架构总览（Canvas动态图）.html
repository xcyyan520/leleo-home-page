<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 智能客服 + 工单平台 · 微服务架构实时动画</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;max-width:100%;height:100%;overflow:hidden;overflow-x:hidden;
    overscroll-behavior:none;-webkit-text-size-adjust:100%;background:#07060f;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",
      "Noto Sans CJK SC","WenQuanYi Micro Hei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#d4cee2;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #topbar{display:flex;align-items:center;gap:6px;flex:0 0 auto;
    padding:calc(9px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left));
    border-bottom:1px solid rgba(139,122,170,.14);background:linear-gradient(180deg,#0a0a1a,#07060f)}
  #tabs{display:flex;align-items:center;gap:6px;min-width:0}
  #brand{font-size:13px;font-weight:700;letter-spacing:.4px;color:#8b7aaa;
    text-shadow:0 0 10px rgba(139,122,170,0.09);margin-right:14px;white-space:nowrap}
  #brand small{color:#7d7799;font-weight:400;font-size:11px;margin-left:6px;letter-spacing:0}
  .tab{position:relative;border:1px solid rgba(127,143,181,.30);background:rgba(16,15,41,.72);
    color:#a79fbe;padding:7px 15px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;
    transition:color .18s,background .18s,border-color .18s;user-select:none;white-space:nowrap}
  .tab:hover{color:#d4cee2;border-color:rgba(139,122,170,.55)}
  .tab.on{color:#efe9f5;background:rgba(26,23,50,.85);border-color:#8b7aaa;
    box-shadow:0 0 16px rgba(139,122,170,0.14),inset 0 -2px 0 #8b7aaa}
  .tab i{font-style:normal;opacity:.55;margin-right:5px;font-size:11px}
  /* 竖屏“完整尺寸”模式：舞台变成横向滚动容器，画布按 2.4 倍手机宽渲染 */
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:hidden;
    overscroll-behavior:contain}
  #cvbox{position:relative;width:100%;height:100%}
  body.m-wide #stage{overflow-x:auto;-webkit-overflow-scrolling:touch}
  body.m-wide #stage::-webkit-scrollbar{height:5px}
  body.m-wide #stage::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
  body.m-wide #stage::-webkit-scrollbar-thumb{background:rgba(139,122,170,.4);border-radius:3px}
  #cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none;
    -webkit-user-select:none;user-select:none}
  #bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:44px;
    padding:0 calc(16px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(16px + env(safe-area-inset-left));
    border-top:1px solid rgba(139,122,170,.14);background:linear-gradient(0deg,#0a0a1a,#07060f)}
  #bar button{border:1px solid rgba(139,122,170,.35);background:rgba(16,15,41,.85);color:#d4cee2;
    font:inherit;font-size:13px;padding:6px 14px;border-radius:7px;cursor:pointer;transition:.16s}
  #bar button:hover{border-color:#8b7aaa;box-shadow:0 0 12px rgba(139,122,170,0.14);color:#fff}
  #bar button:active{transform:translateY(1px)}
  #bar button.on{border-color:#8b7aaa;color:#efe9f5;background:rgba(26,23,50,.9);
    box-shadow:0 0 14px rgba(139,122,170,0.06)}
  #bar label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#a79fbe;cursor:pointer;
    padding:5px 11px;border:1px dashed rgba(127,143,181,.35);border-radius:7px;user-select:none}
  #bar label:hover{color:#d4cee2;border-color:rgba(139,122,170,.5)}
  #bar input{accent-color:#8b7aaa;width:14px;height:14px;cursor:pointer}
  #hint{margin-left:auto;font-size:11.5px;color:#6f6a8b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hint b{color:#8b7aaa;font-weight:600}
  #st{font-size:11.5px;color:#807aa2;min-width:172px}

  /* ---- 移动端新增控件 ---- */
  #swipeHint{display:none;align-items:center;font-size:12px;color:#a294bb;white-space:nowrap;
    padding:7px 10px;border:1px dashed rgba(139,122,170,.45);border-radius:7px;
    background:rgba(16,14,40,.62);transition:opacity .6s;opacity:1}
  body.m-wide #swipeHint{display:flex}
  #swipeHint.dim{opacity:.4}
  #btnZoomIn,#btnZoomOut{min-width:44px;font-weight:700}
  /* 手机上节点详情 = 全宽底部抽屉（替代桌面右侧窄栏） */
  #drawer{position:fixed;left:0;right:0;bottom:0;max-height:70vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;z-index:60;display:none;
    background:linear-gradient(180deg,rgba(13,13,36,.985),rgba(10,10,26,.99));
    border-top:1px solid rgba(139,122,170,.5);box-shadow:0 -14px 44px rgba(0,0,0,.72);
    padding:12px calc(14px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    color:#d4cee2;font-size:13px;line-height:1.6}
  #drawer.show{display:block}
  #drawer .dw-hd{display:flex;align-items:flex-start;gap:10px}
  #drawer .dw-name{flex:1 1 auto;font-size:17px;font-weight:800;color:#efe9f5;word-break:break-word}
  #drawer .dw-x{flex:0 0 auto;width:44px;height:44px;margin:-6px -6px 0 0;border-radius:10px;
    border:1px solid rgba(181,106,106,.5);background:rgba(181,106,106,.14);color:#c08a8a;
    font:inherit;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #drawer .dw-layer{font-size:12px;font-weight:700;color:#8b7aaa;margin-top:2px}
  #drawer .dw-tech{font-size:12px;color:#a79fbe;margin-top:4px}
  #drawer .dw-m{display:flex;gap:10px;margin:10px 0 4px 0}
  #drawer .dw-m>div{flex:1 1 0;border:1px solid rgba(139,122,170,.3);border-radius:9px;
    background:rgba(139,122,170,.07);padding:7px 10px;min-width:0}
  #drawer .dw-m span{display:block;font-size:12px;color:#807aa2}
  #drawer .dw-m b{font-size:16px;color:#8b7aaa;word-break:break-all}
  #drawer h4{font-size:12.5px;font-weight:700;margin:12px 0 6px 0;color:#8b7aaa}
  #drawer h4+.api{color:#7fa07a}
  #drawer ul{list-style:none}
  #drawer li{font-size:12.5px;color:#cdc7dd;background:rgba(127,143,181,.09);
    border-radius:6px;padding:6px 9px;margin-bottom:6px;word-break:break-word}
  #drawer li.star{color:#c4a970;font-weight:700}
  #drawer ul.api li{background:rgba(127,160,122,.08);color:#c3d3bf}
  #drawer p{font-size:12.5px;color:rgba(212,206,226,.92)}

  /* ================= 手机（窄屏）适配 ================= */
  @media (max-width:860px){
    #topbar{flex-direction:column;align-items:stretch;gap:0;padding-right:0;padding-left:0;
      padding-top:calc(8px + env(safe-area-inset-top))}
    #brand{margin:0 0 6px 0;padding:0 calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
      font-size:13px;white-space:normal}
    #brand small{font-size:12px;margin-left:5px}
    #tabs{overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;
      gap:6px;padding:0 calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));
      scrollbar-width:none}
    #tabs::-webkit-scrollbar{display:none}
    .tab{flex:0 0 auto;min-height:44px;display:flex;align-items:center;font-size:12.5px;padding:0 12px}
    .tab i{font-size:11px;margin-right:4px}
    #bar{height:auto;min-height:44px;flex-wrap:wrap;gap:8px;
      padding:8px calc(12px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
    #bar button{flex:0 1 auto;min-height:40px;font-size:13px;padding:8px 10px}
    #btnPlay,#btnReset{flex:1 1 0}
    #btnZoomIn,#btnZoomOut{flex:0 0 46px;min-width:46px;padding:0;font-size:16px}
    #bar label{flex:0 1 auto;min-height:40px;font-size:12.5px;padding:8px 10px}
    #st{font-size:12px;min-width:0;flex:0 1 auto;order:9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #hint{display:none}
    #swipeHint{font-size:12px;flex:0 1 auto}
  }

  /* 横屏手机（矮视口）：顶栏压成一行、控制条压成两行，把高度留给画布 */
  @media (max-width:900px) and (max-height:540px){
    #topbar{flex-direction:row;align-items:center}
    #brand{margin:0 10px 0 0;padding:0;font-size:13px}
    #tabs{flex:1 1 auto}
    .tab{min-height:40px;padding:0 10px}
    #bar button,#bar label{min-height:40px;padding-top:6px;padding-bottom:6px}
    #st{flex:1 1 auto;order:0}
  }
</style>

/* ---- tier 1: raised surfaces (the real "cards") ---- */
.card,.kpi,.hero,.chain-box,.tl-item > .card{
  background-color:rgba(24,21,48,.72) !important;
  background-image:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 140px) !important;
  border:1px solid rgba(255,255,255,.075) !important;
  border-radius:14px !important;
  box-shadow:0 10px 30px -22px rgba(0,0,0,.95);
  transition:border-color .25s ease,transform .25s ease;
}
.card:hover,.kpi:hover,.hero:hover,.chain-box:hover,.tl-item > .card:hover{
  border-color:rgba(255,255,255,.14) !important;
}

/* ---- tier 2: recessed wells (structure, not chrome) ---- */
.group,.fig,.tblwrap,.tbl-wrap,.check,.term,.svc{
  background-color:rgba(255,255,255,.02) !important;
  background-image:none !important;
  border:1px solid rgba(255,255,255,.055) !important;
  border-radius:12px !important;
}

/* ---- tier 3: small repeated bits ---- */
.box,.node,.chip{
  background-color:rgba(255,255,255,.025) !important;
  background-image:none !important;
  border:1px solid rgba(255,255,255,.06) !important;
  border-radius:10px !important;
  transition:border-color .2s ease,background-color .2s ease;
}
.box:hover,.node:hover,.chip:hover{
  border-color:rgba(255,255,255,.14) !important;
  background-color:rgba(255,255,255,.045) !important;
}
.badge{border-radius:999px !important;}

/* ---- accents keep their colour coding ---- */
.note.ok,.note.red{border-left-width:3px !important;}
.intro{border-left:3px solid rgba(139,122,170,.55) !important;}

/* ---- chrome bars: solid, never blurred ---- */
.topbar,#topbar,.topbar-inner{ background:transparent !important; }
.topbar,#topbar{
  background:rgba(9,9,24,.92) !important;
  border-bottom:1px solid rgba(255,255,255,.07) !important;
  box-shadow:none !important;
}
#bar{
  background:rgba(9,9,24,.94) !important;
  border-top:1px solid rgba(255,255,255,.07) !important;
}
button,a.backlink,.backlink{
  background:rgba(24,21,48,.8) !important;
  border-color:rgba(255,255,255,.09) !important;
  border-radius:10px !important;
  transition:border-color .2s ease,color .2s ease,background-color .2s ease;
}
button:hover,a.backlink:hover,.backlink:hover{
  border-color:rgba(139,122,170,.55) !important;
  background:rgba(34,30,64,.9) !important;
}

/* ---- typography & rhythm ---- */
.brand,#brand,.sec-no,.hero h1,h2.part,h1#barT,.t h1{
  font-family:'Georgia','Noto Serif SC','Songti SC',serif;
  letter-spacing:.03em;
}
h2.part{
  background:none !important;
  border:none !important;
  border-left:3px solid rgba(139,122,170,.6) !important;
  border-radius:0 !important;
  box-shadow:none !important;
  padding:2px 0 2px 14px !important;
  margin:44px 0 18px !important;
  color:#ece7f3 !important;
  font-size:18px !important;
  letter-spacing:.02em;
}
.sec-head{margin:0 0 12px !important;}
.sec-no{color:rgba(196,169,112,.75) !important;}

/* tables read as data, not as boxes */
.tbl-wrap table,.tblwrap table{width:100%;border-collapse:collapse;}
.tbl-wrap th,.tblwrap th{
  position:sticky;top:0;z-index:2;
  background:rgba(14,13,32,.96) !important;
  color:#e8e2d8 !important;font-weight:600;text-align:left;
}
.tbl-wrap tr:nth-child(even) td,.tblwrap tr:nth-child(even) td{
  background:rgba(255,255,255,.016);
}

/* long-form reading comfort */
p,li{line-height:1.85;}
.wrap{padding-left:20px !important;padding-right:20px !important;}

/* ---- scrollbar ---- */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(139,122,170,.28);border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:rgba(139,122,170,.45)}

/* ---- mobile: drop the far star layer (half the raster area) ---- */
@media (max-width:767px){
  body::before{

  for (var x = gx; x <= w + step; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (var y = gy - step; y <= h + step; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }

  c.fill(c.radial(w * 0.5, -h * 0.16, h * 0.98, C.cyan, 0.2 * pulse, 0));
  ctx.fillRect(0, 0, w, h);
  c.fill(c.radial(w * 0.84, h * 1.06, h * 0.72, C.blue, 0.09, 0));
  ctx.fillRect(0, h * 0.35, w, h * 0.65);

  for (i = 0; i < this.stars.length; i++) {
    s = this.stars[i];
    var sy = s.y - (t * s.v) % (h + 44);
    if (sy < -22) sy += h + 44;

  ctx.fillRect(0, 0, w, h);
};

  }

    var o = {

      tables: node.tables, apis: node.apis, qps: node.qps, ms: node.ms,
      color: node.color || layerObj.color, layer: layerObj.name, layerSub: layerObj.sub,
      x: x, y: yy, w: w, h: h, cx: x + w / 2, cy: yy + h / 2, hv: 0
    };
    layerObj.nodes.push(o);
    pos[o.key] = o;

  }

    L = layers[i]; var S = LAYER_SPEC[i];
    if (L.type === 'one' || L.type === 'two') {
      if (L.type === 'one') {
        n = S.nodes[0];
        put(n, L, (MW - n.w) / 2, L.y + (L.h - n.h) / 2, n.w, n.h);
      } else {
        var tot = 0;

        var gg = 130;
        var startX = (MW - (tot + gg * (S.nodes.length - 1))) / 2;
        for (j = 0; j < S.nodes.length; j++) {
          n = S.nodes[j];
          put(n, L, startX, L.y + (L.h - n.h) / 2, n.w, n.h);

      if (Math.abs(pp[0] - qq[0]) > 0.6 || Math.abs(pp[1] - qq[1]) > 0.6) clean.push(pp);
    }
    return { pts: clean, color: color, label: label || '', len: polyLen(clean) };
  }
  var flows = [
    link('nginx', 'gateway', C.cyan, 'HTTPS · 灰度'),
    link('gateway', 'nacos', C.cyan, '服务发现 / 动态配置'),
    link('nacos', 'conversation', C.cyan, '实例列表 + 配置下发'),
    link('conversation', 'ai', C.warn, 'OpenFeign（本质是一个 HTTP 请求）'),
    link('ai', 'knowledge', C.warn, 'RAG /inner/knowledge/search'),
    link('conversation', 'mysql', C.blue, '消息落库 · 会话状态'),
    link('conversation', 'redis', C.red, '上下文 30min · 路由表'),
    link('conversation', 'kafka', C.cyan, '按 sessionId 分区保序'),
    link('ticket', 'mysql', C.blue, '工单 + SLA'),
    link('knowledge', 'es', C.blue, 'BM25'),
    link('knowledge', 'pgv', C.warn, '向量 TopK'),
    link('ai', 'deepseek', C.warn, '主通道'),
    link('ai', 'qwen', C.warn, '备通道')
  ].filter(Boolean);
  for (i = 0; i < flows.length; i++) flows[i].phase = i * 0.137;
  return { layers: layers, pos: pos, flows: flows, w: MW, h: worldH };
}

/* ==========================================================================
   4. 场景一
   ========================================================================== */
function Scene1() {
  Scene.call(this, 'arch', '场景一 · 分层架构图', C.cyan);
  this.cam = { x: 0, y: 0, z: 1 };
  this.camReady = false;
  this.drag = null;
  this.panel = 0; this.panelNode = null;
  this.metrics = null;
  this.mt = 0;
}
Scene1.prototype = Object.create(Scene.prototype);
Scene1.prototype.constructor = Scene1;

Scene1.prototype.buildRows = function () {
  this.rows = [];
  if (!ARCH) return;
  for (var i = 0; i < ARCH.layers.length; i++) {
    var ns = ARCH.layers[i].nodes;
    for (var j = 0; j < ns.length; j++) {
      var n = ns[j];
      var sx = n.x * this.cam.z + this.cam.x, sy = n.y * this.cam.z + this.cam.y;
      this.addHit(sx, sy, n.w * this.cam.z, n.h * this.cam.z, { key: n.key, kind: 'node', data: n });
    }
  }
};
Scene1.prototype.layout = function (w, h) {
  Scene.prototype.layout.call(this, w, h);
  if (!ARCH) ARCH = resolveArch();
  if (!this.camReady && w > 60) {
    /* 顶部标题条 46px、底部解说条 60px 不参与取景，zoom 下限 0.5 / 上限 1.2
       手机“完整尺寸”模式：整图缩小会看不清，改为至少 0.9 倍，超出部分单指拖拽查看 */
    var availH = Math.max(200, h - 46 - 60), availW = Math.max(240, w - 48);
    var minZ = VIEW.wide ? 0.9 : 0.5;
    this.cam.z = clamp(Math.max(Math.min(availW / ARCH.w, availH / ARCH.h), minZ), 0.5, 2.0);
    this.cam.x = (w - ARCH.w * this.cam.z) / 2;
    this.cam.y = 46 + Math.max(0, (availH - ARCH.h * this.cam.z) / 2);
    this.camReady = true;
  }
  if (!this.metrics) {
    this.metrics = { qps: 30, p99: 96, err: 0.42, conn: 1284 };
  }
  this.buildRows();
  this.maxScroll = 0;
};
Scene1.prototype.s2w = function (x, y) { return { x: (x - this.cam.x) / this.cam.z, y: (y - this.cam.y) / this.cam.z }; };
Scene1.prototype.qpsOf = function (n) {
  if (n._j === undefined) n._j = rnd(0, TAU);
  return Math.max(0, n.qps * (1 + 0.15 * Math.sin(this.t * 1.05 + n._j) + 0.07 * Math.sin(this.t * 2.7 + n._j * 2)));
};
Scene1.prototype.msOf = function (n) {
  if (n._j === undefined) n._j = rnd(0, TAU);
  return Math.max(0.1, n.ms * (1 + 0.13 * Math.sin(this.t * 0.9 + n._j + 1.2)));
};
Scene1.prototype.update = function (dt) {
  Scene.prototype.update.call(this, dt);
  this.mt += dt;
  if (this.mt >= 0.9) {
    this.mt -= 0.9;
    var m = this.metrics;
    m.qps = clamp(m.qps + rnd(-1.7, 1.7), 22, 38);
    m.p99 = clamp(m.p99 + rnd(-9, 9), 72, 138);
    m.err = clamp(m.err + rnd(-0.09, 0.09), 0.08, 1.15);
    m.conn = clamp(m.conn + rnd(-28, 28), 1080, 1500);
  }
  var i, j, n, tgt;
  if (ARCH) {
    for (i = 0; i < ARCH.layers.length; i++) {
      var ns = ARCH.layers[i].nodes;
      for (j = 0; j < ns.length; j++) {
        n = ns[j];
        tgt = (this.hover && this.hover.key === n.key) ? 1 : 0;
        n.hv = lerp(n.hv, tgt, clamp(dt * 10, 0, 1));
      }
    }
  }
  var pt = this.panelNode ? 1 : 0;
  this.panel = lerp(this.panel, pt, clamp(dt * 9, 0, 1));
  if (Math.abs(this.panel - pt) < 0.003) this.panel = pt;
  if (this.hover && this.hover.kind === 'node') {
    var h = this.hover.data;
    this.narr(h.name + ' —— 当前 ' + this.qpsOf(h).toFixed(1) + ' 次/秒（演示值）· 平均耗时 ' +
      this.msOf(h).toFixed(h.ms < 10 ? 2 : 0) + ' ms。' +
      (VIEW.narrow ? '点一下节点看职责 / 关键表 / 暴露接口。' : '单击查看职责 / 关键表 / 暴露接口。'));
  } else {
    this.narr('7 个微服务 + 6 类中间件 + 双 LLM 通道，' + ARCH.flows.length +
      ' 条调用链持续流动。' + (VIEW.narrow
        ? '单指拖拽平移、双指捏合或 ＋− 按钮缩放（0.5~2.0）；点节点看实时指标与详情。'
        : '拖拽平移、滚轮缩放（0.5~2.0）；悬停节点看实时指标，单击节点看详情。'));
  }
};
/** 悬停高亮与信息面板的滑动：暂停时也要响应，否则点了节点看不到面板 */
Scene1.prototype.uiUpdate = function (dt) {
  var i, j, n, tgt;
  if (!ARCH) return;
  for (i = 0; i < ARCH.layers.length; i++) {
    var ns = ARCH.layers[i].nodes;
    for (j = 0; j < ns.length; j++) {
      n = ns[j];
      tgt = (this.hover && this.hover.key === n.key) ? 1 : 0;
      n.hv = lerp(n.hv, tgt, clamp(dt * 11, 0, 1));
    }
  }
  var pt = this.panelNode ? 1 : 0;
  this.panel = lerp(this.panel, pt, clamp(dt * 11, 0, 1));
  if (Math.abs(this.panel - pt) < 0.002) this.panel = pt;
};
Scene1.prototype.draw = function (c, w, h) {
  var i, j, n, L;
  if (!ARCH) return;
  c.save();
  c.ctx.translate(this.cam.x, this.cam.y);
  c.ctx.scale(this.cam.z, this.cam.z);

  /* 层分组框 */
  for (i = 0; i < ARCH.layers.length; i++) {
    L = ARCH.layers[i];
    c.rr(L.x, L.y, L.w, L.h, 15);
    c.fill(c.lingrad(L.x, L.y, L.x + L.w, L.y + L.h, [
      [0, rgba(L.color, 0.075)], [0.55, rgba(L.color, 0.026)], [1, rgba(L.color, 0.058)]]));
    c.ctx.fill();
    c.stroke(rgba(L.color, 0.28)); c.lw(1.2); c.ctx.stroke();
    c.ctx.beginPath(); c.ctx.moveTo(L.x + 40.5, L.y + 10); c.ctx.lineTo(L.x + 40.5, L.y + L.h - 10);
    c.stroke(rgba(L.color, 0.3)); c.lw(1); c.ctx.stroke();
    c.save();
    c.ctx.translate(L.x + 22, L.y + L.h / 2); c.ctx.rotate(-Math.PI / 2);
    c.font(16, 700); c.fill(rgba(L.color, 0.95)); c.text(L.name, 0, 0, 'center');
    c.ctx.restore();
    c.font(11, 600); c.fill(rgba(L.color, 0.5)); c.text(L.sub, L.x + L.w - 12, L.y + 16, 'right');
  }

  /* 连线 */
  for (i = 0; i < ARCH.flows.length; i++) {
    var fl = ARCH.flows[i];
    flowLine(c, fl.pts, fl.color, this.t * 0.5 + fl.phase,
      { dots: 3, dotR: 2.5, speed: Math.max(0.35, 220 / fl.len), lw: 2.2, lw2: 1.5 });
  }
  /* 连线标签（★必须画在节点之后，否则会被不透明卡片盖住 —— 见下方 LABELS 段） */

  /* 节点 */
  for (i = 0; i < ARCH.layers.length; i++) {
    L = ARCH.layers[i];
    for (j = 0; j < L.nodes.length; j++) {
      n = L.nodes[j];
      var hov = n.hv;
      var sel = (this.selected && this.selected.key === n.key) ? 1 : 0;
      var col = n.color;
      var breath = 0.5 + 0.5 * Math.sin(this.t * 1.4 + i * 0.9 + j * 0.7);
      var big = n.h >= 70;
      c.save();
      c.rr(n.x, n.y, n.w, n.h, 12);
      c.fill(c.lingrad(n.x, n.y, n.x, n.y + n.h, [[0, 'rgba(14,14,37,.95)'], [1, 'rgba(11,10,31,.95)']]));
      c.ctx.fill();
      if (hov > 0.01) {
        c.fill(c.lingrad(n.x, n.y, n.x + n.w, n.y + n.h, [[0, rgba(col, 0.16 * hov)], [0.65, rgba(col, 0)]]));
        c.ctx.fill();
      }
      c.stroke(rgba(col, clamp(0.30 + 0.36 * hov + 0.42 * sel + 0.10 * breath, 0, 1)));
      c.lw(1.4 + hov * 0.9 + sel * 0.7);
      c.shadow(rgba(col, 0.5 + 0.4 * hov), 9 + 20 * hov + 16 * sel);
      c.ctx.stroke(); c.noshadow();
      c.fillRR(n.x + 1.2, n.y + 9, 3.2, n.h - 18, 2, rgba(col, 0.85));
      /* 文字：整体缩放约 0.65x，所以基准字号要放大以保证可读 */
      var fsz = n.w > 460 ? 19 : 16;
      c.font(fsz, 700); c.fill(hov > 0.3 ? '#f0ece4' : '#e2dcec');
      c.text(c.clip(n.name, n.w - 30, fsz, 700), n.x + 15, n.y + (big ? 25 : 22), 'left');
      c.font(11.5, 500); c.fill(rgba(col, 0.9));
      c.text(c.clip(n.tech, n.w - 30, 11.5, 500), n.x + 15, n.y + (big ? 46 : 41), 'left');
      var showM = Math.max(hov, sel);
      if (showM > 0.02) {
        c.alpha(showM);
        c.font(11.5, 700); c.fill(C.ok);
        c.text('▲ ' + this.qpsOf(n).toFixed(1) + ' 次/秒', n.x + 15, n.y + n.h - 16, 'left');
        c.fill(C.cyan);
        c.text('⏱ ' + this.msOf(n).toFixed(n.ms < 10 ? 1 : 0) + ' ms', n.x + 115, n.y + n.h - 16, 'left');
        c.alpha(1);
      } else if (big) {
        c.font(10, 500); c.fill('rgba(125,119,153,.7)');
        c.text('悬停看实时指标 · 单击看详情', n.x + 15, n.y + n.h - 16, 'left');
      }
      c.restore();
    }
  }
  c.restore();

  /* ══ 连线标签（★必须放在节点绘制之后）════════════════════════════════
     两个要点：
     1) 顺序：节点卡片是不透明的（fill 用 rgba(...,.95)）。标签若先画、
        卡片后画，就会被压住 —— 表现就是"OpenFeign（本质是一个 HTTP
        请求）""RAG /inner/knowledge/search"这类文字被挡掉一半。
     2) 落位：不再机械取路径中点（中点常常正好落在卡片上）。
        改为沿路径采样，挑一个"离所有卡片最远 + 尽量靠中点"的位置。
     ═════════════════════════════════════════════════════════════════ */
  var allNodes = [];
  for (i = 0; i < ARCH.layers.length; i++) {
    for (j = 0; j < ARCH.layers[i].nodes.length; j++) allNodes.push(ARCH.layers[i].nodes[j]);
  }
  /* 某点到所有卡片外接矩形的距离（落在卡片内部算负） */
  function clearOfNodes(x, y) {
    var best = 1e9;
    for (var k = 0; k < allNodes.length; k++) {
      var nn = allNodes[k];
      var dx = Math.max(nn.x - x, 0, x - (nn.x + nn.w));
      var dy = Math.max(nn.y - y, 0, y - (nn.y + nn.h));
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < best) best = d;
    }
    return best;
  }
  for (i = 0; i < ARCH.flows.length; i++) {
    var f2 = ARCH.flows[i];
    if (!f2.label) continue;
    c.font(11, 600);
    var tw = c.measure(f2.label, 11, 600);
    var need = tw / 2 + 8;                       /* 标签半宽 + 一点余量 */
    var bestPt = polyPoint(f2.pts, 0.5), bestScore = -1e9;
    for (var s = 0.30; s <= 0.701; s += 0.04) {  /* 只在路径中段找，别贴到端点 */
      var cand = polyPoint(f2.pts, s);
      var free = clearOfNodes(cand.x, cand.y);
      /* 够空就优先；同样空的话越靠中点越好 */
      var score = Math.min(free, need) * 10 - Math.abs(s - 0.5) * 60;
      if (score > bestScore) { bestScore = score; bestPt = cand; }
    }
    var lx = bestPt.x, ly = bestPt.y;
    /* 还是会被压住（两侧都是卡片、无处可躲）→ 垂直方向再推一点，尽量挤进缝里 */
    if (clearOfNodes(lx, ly) < 2) {
      var up = { x: lx, y: ly - 16 }, dn = { x: lx, y: ly + 16 };
      ly = (clearOfNodes(up.x, up.y) >= clearOfNodes(dn.x, dn.y)) ? up.y : dn.y;
    }
    c.fillRR(lx - tw / 2 - 7, ly - 9, tw + 14, 18, 9, 'rgba(9,9,25,.94)');
    c.strokeRR(lx - tw / 2 - 7, ly - 9, tw + 14, 18, 9, rgba(f2.color, 0.5), 1);
    c.fill(rgba(f2.color, 0.98));
    c.text(f2.label, lx, ly + 0.5, 'center');
  }

  this.drawHud(c, w, h);

  if (this.hover && this.hover.kind === 'node') {
    var vx0 = VIEW.wide ? VIEW.scrollLeft : 0, vw0 = VIEW.wide ? VIEW.clientW : w;
    var tpw = 236, tph = 76;
    var tx = clamp(this.hover.x + this.hover.w + 12, vx0 + 8, vx0 + vw0 - tpw - 8);
    var maxY = Math.min(h - 8, VIEW.tipMaxY);
    var ty = clamp(this.hover.y, 8, Math.max(8, maxY - tph));
    this.drawTip(c, tx, ty, this.hover.data);
  }
  /* 手机上详情面板走 DOM 全宽底部抽屉，画布内不再画右侧窄栏 */
  if (this.panel > 0.01 && this.panelNode && !VIEW.narrow) this.drawPanel(c, w, h);

  c.font(11, 500); c.fill('rgba(125,119,153,.85)');
  var vx1 = VIEW.wide ? VIEW.scrollLeft : 0;
  c.text('缩放 ' + this.cam.z.toFixed(2) + '× · 拖拽平移 · ' +
    (VIEW.narrow ? '双指缩放 / ＋− 按钮' : '滚轮缩放'), vx1 + 16, h - 70, 'left');
  /* 解说条由 App.draw 统一绘制 */
};
Scene1.prototype.drawHud = function (c, w, h) {
  var vx = VIEW.wide ? VIEW.scrollLeft : 0, vw = VIEW.wide ? VIEW.clientW : w;
  var pw = 236, ph = 94, x = vx + vw - pw - 14, y = 12, m = this.metrics, i;
  c.save();
  c.fillRR(x, y, pw, ph, 11, 'rgba(10,10,27,.9)');
  c.glowRR(x, y, pw, ph, 11, rgba(C.cyan, 0.32), 1, rgba(C.cyan, 0.35), 12);
  c.font(10.5, 700); c.fill(rgba(C.cyan, 0.9)); c.text('实时指标', x + 14, y + 17, 'left');
  c.dot(x + pw - 44, y + 17, 3.4, C.ok, 8);
  c.font(9.5, 700); c.fill(rgba(C.ok, 0.9)); c.text('LIVE', x + pw - 35, y + 17.5, 'left');
  var rows = [
    ['处理速率【估算】', m.qps.toFixed(1), C.cyan],

    ['错误率', m.err.toFixed(2) + ' %', m.err > 0.85 ? C.warn : C.ok],
    ['活跃连接数', m.conn.toFixed(0), C.cyan]
  ];
  for (i = 0; i < rows.length; i++) {
    var ry = y + 34 + i * 15;
    c.font(10.5, 500); c.fill(rgba(C.dim, 0.95)); c.text(rows[i][0], x + 14, ry, 'left');
    c.font(11.5, 700); c.fill(rows[i][2]); c.text(rows[i][1], x + pw - 14, ry, 'right');
  }

};
Scene1.prototype.drawTip = function (c, x, y, n) {
  var pw = 236, ph = 76;

  c.fillRR(x, y, pw, ph, 10, 'rgba(10,10,26,.95)');

};
Scene1.prototype.drawPanel = function (c, w, h) {
  var n = this.panelNode;

  cy += 17;

  cy += 17;

  c.stroke(rgba(col, 0.22)); c.lw(1); c.ctx.stroke();
  cy += 20;
  /* 指标小卡 */

  ];
  for (i = 0; i < 2; i++) {

    c.fillRR(bx, cy - 10, bw2, 42, 8, rgba(boxes[i][2], 0.08));
    c.strokeRR(bx, cy - 10, bw2, 42, 8, rgba(boxes[i][2], 0.32), 1);
    c.font(9.5, 500); c.fill(rgba(C.dim, 1)); c.text(boxes[i][0], bx + 9, cy + 1, 'left');
    c.font(14.5, 700); c.fill(boxes[i][2]); c.text(boxes[i][1], bx + 9, cy + 20, 'left');
  }
  cy += 48;
  c.font(11.5, 700); c.fill(rgba(col, 0.95)); c.text('▌ 职责', px, cy, 'left'); cy += 18;
  cy += c.para(n.duty, px, cy, pwid, 17, 11.5, 'rgba(212,206,226,.92)', 400);
  cy += 16;
  c.font(11.5, 700); c.fill(rgba(C.blue, 0.95)); c.text('▌ 关键表', px, cy, 'left'); cy += 18;
  for (i = 0; i < n.tables.length; i++) {
    c.fillRR(px, cy - 9, pwid, 20, 5, 'rgba(127,143,181,.09)');

      '）；右侧为核心 API 三组，每条右侧流动光点代表有流量；内部接口 /inner/* 网关不放行。');
  }
};
Scene4.prototype.draw = function (c, w, h) {
  var i, j, k, G, cr, A;

    '左：5 大类表结构（AI 5 张高亮，ai_execution 最重要）　右：三组核心 API');

  c.save();

  for (i = 0; i < T4_GROUPS.length; i++) {
    G = T4_GROUPS[i];
    var box = G.box;

      c.strokeRR(cr.x, cr.y, cr.w, cr.h, 7,
        rgba(cr.star ? C.warn : G.color, cr.star ? 0.95 : (hov ? 0.8 : 0.32)), cr.star ? 1.8 : 1);

  c.restore();

  /* 表名悬停浮层 */
  if (this.hover && this.hover.kind === 'table') this.drawTableTip(c, w, h, this.hover.data);

  /* ---- 右半屏 ---- */
  var R = this.right;
  c.save();
  c.ctx.beginPath(); c.ctx.rect(R.x - 4, R.y, R.w + 8, R.h);
  c.ctx.clip();
  c.ctx.translate(0, -this.scrollR);
  for (k = 0; k < this.apiGroups.length; k++) {
    var box3 = this.apiGroups[k];
    A = T4_APIS[k];
    c.fillRR(box3.x, box3.y, box3.w, box3.h, 12, c.lingrad(box3.x, box3.y, box3.x + box3.w, box3.y + box3.h,
      [[0, rgba(A.color, 0.075)], [1, rgba(A.color, 0.025)]]));
    c.strokeRR(box3.x, box3.y, box3.w, box3.h, 12, rgba(A.color, 0.32), 1.2);
    c.font(12.5, 700); c.fill(rgba(A.color, 0.98));

    }
    for (j = 0; j < A.items2.length; j++) {
      var it = A.items2[j];

      c.fillRR(it.x, it.y, it.w, it.h, 6, hovA ? rgba(A.color, 0.2) : 'rgba(13,12,35,.85)');
      c.strokeRR(it.x, it.y, it.w, it.h, 6, rgba(A.color, hovA ? 0.6 : 0.18), 1);

  c.font(10, 500); c.fill('rgba(125,119,153,.9)');
  c.text('滚轮在右半屏可滚动 · 左半屏悬停表名看职责', R.x, h - 70, 'left');

  /* 解说条由 App.draw 统一绘制 */
};

/* ---- 标签页 ---- */

function setScene(i, src) {

/* ---- 尺寸 / 显示模式 ---- */
function fit() {
  var info = viewInfo();
  var wasWide = VIEW.wide, wasW = app.w;
  VIEW.narrow = info.narrow; VIEW.portrait = info.portrait; VIEW.wide = info.wide;
  syncViewUI();                       /* 先按模式显隐控件（会改变控制条行数，进而影响舞台高度） */
  var r = stageEl.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var sw = Math.max(280, Math.round(r.width));
  var sh = Math.max(240, Math.round(r.height));
  VIEW.clientW = sw; VIEW.clientH = sh;
  var LOGW = Math.min(1400, Math.max(880, Math.round(sw * LOGICAL_MULT)));
  if (VIEW.wide) {
    /* 竖屏“完整尺寸”：画布逻辑宽 = 手机宽 × 2.4，靠横向滑动看全 */
    app.w = LOGW; app.h = sh; app.k = 1;
  } else if (info.portrait || sw < 1180) {
    /* ★“适配屏幕”：整幅画面等比缩小铺满可视区。
       原来是 (info.narrow && info.portrait) 才走这里 —— 结果**桌面窄窗口走的是 1:1 逻辑像素**，
       架构图本身比窗口宽（约 1288px 逻辑宽），于是右边被裁掉、还得横向拖才能看全
       （用户反馈：“这个怎么随着我的窗口缩小而动的”）。
       现在改成：只要不是竖屏“完整尺寸”，一律把逻辑宽拉到 LOGW、
       再把**画布高度按缩放比例反推**，这样整张图必然完整落在可视区内。

       注意逻辑宽为什么必须是 LOGW 而不是 sw：
       场景一的摄像机在 layout() 里会做一次自适应缩放
       （min(可用宽/ARCH.w, 可用高/ARCH.h)，且下限 0.5），
       如果 canvas 逻辑宽只有 sw（比如 900），缩放会被顶到下限 0.5 或算出的值偏小，
       画面反而更小、四周留白。给足 LOGW 让摄像机有空间，结果最稳。 */
    app.w = LOGW;
    app.k = Math.min(sw / LOGW, sh / Math.max(1, EST_H));
    app.h = Math.round(sh / app.k);
  } else {
    app.w = Math.max(360, sw); app.h = sh; app.k = 1;
  }
  cv.resize(app.w, app.h, dpr, app.k);
  cv.el.style.width = Math.round(app.w * app.k) + 'px';
  cv.el.style.height = Math.round(app.h * app.k) + 'px';
  cvboxEl.style.width = Math.round(app.w * app.k) + 'px';
  cvboxEl.style.height = Math.round(app.h * app.k) + 'px';
  document.body.classList.toggle('m-wide', VIEW.wide);
  bg.resize(app.w, app.h);
  wrapCache = {};
  var refit = (wasWide !== VIEW.wide) || (wasW !== app.w);
  for (var i = 0; i < scenes.length; i++) {
    if (refit && scenes[i].camReady !== undefined) scenes[i].camReady = false;
    scenes[i].layout(app.w, app.h);
  }
  VIEW.scrollLeft = stageEl.scrollLeft || 0;
  updateTipLimit();
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 220); });
stageEl.addEventListener('scroll', function () {

  s.onHover(p.x, p.y);
});
canvasEl.addEventListener('mousedown', function (e) {
  var p = evPos(e), s = scenes[app.idx];
  s.down = { x: p.x, y: p.y };
  s.onDown(p.x, p.y);
});
window.addEventListener('mouseup', function (e) {
  var s = scenes[app.idx];
  if (!s.down) return;
  var r = canvasEl.getBoundingClientRect();
  var k = app.k || 1;
  var mx = (e.clientX - r.left) / k, my = (e.clientY - r.top) / k;
  var moved = s.onUp ? s.onUp(mx, my) : 0;
  if ((moved || 0) < 5) s.onClick(mx, my);
  s.down = null;
});
canvasEl.addEventListener('mouseleave', function () { scenes[app.idx].hover = null; });
canvasEl.addEventListener('wheel', function (e) {
  e.preventDefault();
  var p = evPos(e), s = scenes[app.idx];
  s.onWheel(p.x, p.y, e.deltaY);
  s.onHover(p.x, p.y);
}, { passive: false });

/* ---- 输入：触摸（单指拖拽平移 / 双指捏合缩放 / 点一下看指标与详情） ---- */
var touchGesture = null;
function tPos(t) {
  var r = canvasEl.getBoundingClientRect();
  var k = app.k || 1;
  return { x: (t.clientX - r.left) / k, y: (t.clientY - r.top) / k };
}
function tDist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
function tMid(a, b) { return { clientX: (a.clientX + b.clientX) / 2, clientY: (a.clientY + b.clientY) / 2 }; }

canvasEl.addEventListener('touchstart', function (e) {
  var s = scenes[app.idx];
  hintEl.classList.add('dim');
  if (e.touches.length >= 2) {
    /* 双指：捏合缩放（场景一），并取消已经开始的平移/单击 */
    if (s.drag) s.drag = null;
    s.down = null;
    touchGesture = {
      pinch: tDist(e.touches[0], e.touches[1]), moved: 999, multi: true,
      x: 0, y: 0, cx0: 0, scroll0: stageEl.scrollLeft
    };
    e.preventDefault();
    return;
  }
  var t = e.touches[0], p = tPos(t);
  touchGesture = {
    pinch: 0, multi: false, moved: 0, x: p.x, y: p.y,
    cx0: t.clientX, cy0: t.clientY, scroll0: stageEl.scrollLeft
  };
  s.down = { x: p.x, y: p.y };
  s.onDown(p.x, p.y);
  e.preventDefault();
}, { passive: false });

canvasEl.addEventListener('touchmove', function (e) {
  var s = scenes[app.idx];
  if (!touchGesture) return;
  if (e.touches.length >= 2) {
    var d = tDist(e.touches[0], e.touches[1]);
    var mid = tMid(e.touches[0], e.touches[1]);
    var pm = tPos(mid);
    if (touchGesture.pinch > 0 && d > 0 && s.zoomBy) s.zoomBy(d / touchGesture.pinch, pm.x, pm.y);
    touchGesture.pinch = d;
    touchGesture.multi = true;
    touchGesture.moved = 999;
    e.preventDefault();
    return;
  }
  if (touchGesture.multi) return;
  var t = e.touches[0], p = tPos(t);
  touchGesture.moved = Math.max(touchGesture.moved,
    Math.abs(t.clientX - touchGesture.cx0) + Math.abs(t.clientY - touchGesture.cy0));
  if (s.cam) {
    /* 场景一：单指拖动 = 画布平移（拖到哪看到哪，不跟着页面滚） */
    s.onMove(p.x, p.y);
  } else {
    /* 其他场景：单指拖动 = 横向滑动查看完整画面；右半屏可纵向滚动内部面板 */
    stageEl.scrollLeft = Math.max(0, touchGesture.scroll0 - (t.clientX - touchGesture.cx0));
    VIEW.scrollLeft = stageEl.scrollLeft;
    if (s.maxScroll > 0.5) s.onWheel(p.x, p.y, -(p.y - touchGesture.y));
  }
  touchGesture.x = p.x; touchGesture.y = p.y;
  e.preventDefault();
}, { passive: false });

canvasEl.addEventListener('touchend', function (e) {
  var s = scenes[app.idx];
  if (!touchGesture) return;
  if (e.touches.length > 0) return;          /* 还有手指在屏幕上 */
  var g = touchGesture;
  touchGesture = null;
  if (!g.multi && g.moved < 8) {
    var p = tPos(e.changedTouches[0]);
    if (s.onUp) s.onUp(p.x, p.y);
    if (s.onTap) s.onTap(p.x, p.y); else s.onClick(p.x, p.y);
  } else if (s.down) {
    if (s.onUp) s.onUp();
  }
  s.down = null;
  updateStatus();
  e.preventDefault();
}, { passive: false });
canvasEl.addEventListener('touchcancel', function () {
  if (touchGesture) { scenes[app.idx].down = null; touchGesture = null; }
}, { passive: true });

window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); setPlaying(!app.playing); }
  else if (e.key >= '1' && e.key <= '4') setScene(parseInt(e.key, 10) - 1, 'key');
});

/* ---- 主循环：背景永远流动，场景只在 active && playing 时推进 ---- */
function tick(now) {
  app.rafId = window.requestAnimationFrame(tick);
  if (!app.lastT) app.lastT = now;
  var dt = (now - app.lastT) / 1000;
  app.lastT = now;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.06) dt = 0.06;
  app.bgT += dt;
  app.frame++;
  for (var i = 0; i < scenes.length; i++) {
    var s = scenes[i];
    if (!s.active) continue;
    if (app.playing) s.update(dt);   /* 数据/动画推进：只有播放时才走 */
    s.uiUpdate(dt);                  /* 悬停 / 面板等交互态：前台就响应 */
  }
  draw();
  if (app.frame % 12 === 0) updateStatus();
  if (app.frame % 18 === 0) refreshDrawerMetrics();
}
function draw() {
  cv.reset();
  VIEW.scrollLeft = stageEl.scrollLeft || 0;
  bg.draw(cv, app.bgT);
  var s = scenes[app.idx];
  if (s) {
    s.layout(app.w, app.h);
    /* 场景自己负责画内容；底部解说条由这里统一绘制在屏幕坐标下（不随滚动移动） */
    s.draw(cv, app.w, app.h);
    Scene.prototype.drawNarration.call(s, cv, app.w, app.h);
  }
  /* 注意：这里不能再调用 cv.reset()，否则会把刚画好的整帧清空 */
  if (typeof window.__drawHook === 'function') {
    try { window.__drawHook(cv, app); } catch (e2) { ERRORS.push(String(e2)); }
  }
}

/* ---- 探针 ---- */
window.__probe = function () {
  var cur = scenes[app.idx];
  var needSwipe = stageEl.scrollWidth > stageEl.clientWidth + 4;
  return {
    scene: cur ? cur.id : 'none',
    playing: !!app.playing,
    canvas: { w: cv.w, h: cv.h },
    bgT: app.bgT,
    sceneT: cur ? cur.t : 0,
    tabs: tabEls.length,
    errors: ERRORS.length,
    sceneIndex: app.idx,
    autoPlay: !!app.autoPlay,
    DPR: cv.dpr,
    sceneTimes: [scenes[0].t, scenes[1].t, scenes[2].t, scenes[3].t],
    view: {
      mode: VIEW.wide ? '完整尺寸' : '适配屏幕',
      narrow: !!VIEW.narrow, portrait: !!VIEW.portrait, wide: !!VIEW.wide,
      logical: { w: app.w, h: app.h },
      css: { w: Math.round(app.w * app.k), h: Math.round(app.h * app.k) },
      k: +app.k.toFixed(4),
      viewport: { w: window.innerWidth, h: window.innerHeight },
      scrollLeft: Math.round(VIEW.scrollLeft || 0),
      maxScroll: Math.max(0, stageEl.scrollWidth - stageEl.clientWidth),
      needSwipe: needSwipe,
      hintShown: VIEW.wide,
      drawer: !!VIEW.drawerOpen,
      camZ: +scenes[0].cam.z.toFixed(3)
    }
  };
};
window.__zoom = function (k) { zoomScene(k); };
window.__view = function (m) { viewMode = m; fit(); draw(); };
window.__tap = function (x, y) { scenes[app.idx].onTap(x, y); };
window.__touchOK = function () {
  return {
    touchstart: true,
    canvasTouchAction: getComputedStyle(canvasEl).touchAction,
    stageOverflowX: getComputedStyle(stageEl).overflowX,
    drawerMaxH: getComputedStyle(drawerEl).maxHeight
  };
};
window.__scene = function (i) { setScene(i, 'probe'); };
window.__setPlaying = function (b) { setPlaying(b); };
window.__errors = function () { return ERRORS.slice(); };

/* ---- 启动（默认不自动播放） ---- */
fit();
scenes[0].active = true;
setPlaying(false);
app.lastT = 0;
/* 立刻同步画一帧：即使 RAF 还没触发/被无头环境节流，画布也不会是空白 */
draw();
updateStatus();
app.rafId = window.requestAnimationFrame(tick);
/* 便于自动化截图 / 分享链接：?scene=2&play=1 可直接定位并自动播放 */
try {
  var qs = String(window.location.search || '');
  var mScene = /[?&]scene=(\d)/.exec(qs);
  if (mScene) setScene(parseInt(mScene[1], 10), 'url');
  if (/[?&]play=1/.test(qs)) {
    var mAuto = /[?&]auto=1/.test(qs);
    if (mAuto) { chkAuto.checked = true; app.autoPlay = true; }
    setPlaying(true);
  }
  draw();
} catch (e) { ERRORS.push(String(e)); }
window.__ready = true;
})();
</script>
</body>
</html>
